  <script>
    (() => {
      const raw = localStorage.getItem('dictator_settings');
      const legacy = localStorage.getItem('dictator_theme');
      let theme = 'system';
      try { theme = raw ? JSON.parse(raw).theme || theme : legacy || theme; } catch {}
      const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
