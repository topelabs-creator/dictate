<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DICTATE | About</title>
  <meta name="description" content="Learn how DICTATE helps students and learners turn notes into spoken audio, listen back privately, and repeat key ideas with a browser-based dictation workflow.">
  <link rel="canonical" href="https://dictate.rakimrakim41.workers.dev/about">
  <script>
    (() => {
      const _gh = location.hostname.endsWith('.github.io'); const _r = _gh ? (location.pathname.split('/').filter(Boolean)[0] || '') : (location.pathname.startsWith('/DICTATOR/') ? 'DICTATOR' : ''); const base = _r ? '/' + _r + '/' : '/';
      const targetHash = `${base}#/about`;
      fetch(`${base}index.html?v=32`)
        .then(r => r.text())
        .then(html => {
          history.replaceState({}, '', targetHash);
          document.open();
          document.write(html.replace('<head>', `<head><base href="${base}">`));
          document.close();
        })
        .catch(() => {
          location.replace(targetHash);
        });
    })();
  </script>
  <style>
    body { font-family: Arial, sans-serif; background:#0f1720; color:#e8eef5; margin:0; padding:40px 20px; }
    .wrap { max-width:760px; margin:0 auto; }
    .card { background:#111d29; border:1px solid #203241; border-radius:16px; padding:28px; }
    a { color:#72d5f4; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>About DICTATE</h1>
      <p>DICTATE helps students, language learners, and busy readers turn notes into speech so they can listen, repeat, and retain more.</p>
      <p>It works in your browser, keeps your content on your device, and supports text, PDF, and DOCX workflows without a backend.</p>
      <p><a href="/about">Open the app About page</a></p>
    </div>
  </div>
</body>
</html>
