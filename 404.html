<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DICTATE | Loading…</title>
  <meta name="description" content="DICTATE is a private browser-based text-to-speech tool for notes, PDFs, and study material.">
  <script>
    (() => {
      const isGitHubPages = location.hostname === 'github.io' || location.hostname.endsWith('.github.io');
      const segments = location.pathname.split('/').filter(Boolean);
      const base = isGitHubPages && segments.length > 0 ? `/${segments[0]}` : '';
      const path = location.pathname.replace(/\/+$/, '');
      const clean = base && path.startsWith(base) ? path.slice(base.length) || '/' : path;
      const dest = clean === '/' ? '/' : clean;
      sessionStorage.setItem('dictator_pending_route', dest);
      const target = base ? `${base}/#${dest}` : `/#${dest}`;
      location.replace(target || '/');
    })();
  </script>
</head>
