<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DICTATE | How to Use</title>
  <meta name="description" content="Learn how to paste notes, upload PDFs or DOCX files, and use DICTATE to listen to study material, repeat ideas, and learn more efficiently.">
  <link rel="canonical" href="https://dictate.rakimrakim41.workers.dev/how-to-use">
  <script>
    (() => {
      const _gh = location.hostname.endsWith('.github.io'); const _r = _gh ? (location.pathname.split('/').filter(Boolean)[0] || '') : (location.pathname.startsWith('/DICTATOR/') ? 'DICTATOR' : ''); const base = _r ? '/' + _r + '/' : '/';
      const targetHash = `${base}#/how-to-use`;
      fetch(`${base}index.html?v=32`)
        .then(r => r.text())
        .then(html => {
          history.replaceState({}, '', targetHash);
          document.open();
          document.write(html.replace('<head>', `<head><base href="${base}">`));
          document.close();
        })
        .catch(() => {
          location.replace(targetHash);
        });
    })();
  </script>
  <style>
    body { font-family: Arial, sans-serif; background:#0f1720; color:#e8eef5; margin:0; padding:40px 20px; }
    .wrap { max-width:760px; margin:0 auto; }
    .card { background:#111d29; border:1px solid #203241; border-radius:16px; padding:28px; }
    a { color:#72d5f4; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>How to Use DICTATE</h1>
      <ol>
        <li>Paste text or upload a TXT, PDF, or DOCX file.</li>
        <li>Create a listening session with your preferred group size and speed.</li>
        <li>Listen, repeat, and revise key ideas.</li>
      </ol>
      <p><a href="/how-to-use">Open the app help page</a></p>
    </div>
  </div>
</body>
</html>
